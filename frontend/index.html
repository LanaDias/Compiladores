<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CompilaLab — início</title>
  <style>
    :root { color-scheme: light; font-family: system-ui, sans-serif; }
    body { margin: 0; background: #f3f5f8; color: #182230; }
    main { max-width: 760px; margin: 8vh auto; padding: 2rem; }
    section { background: white; border: 1px solid #dbe2ea; border-radius: 18px; padding: 2rem; box-shadow: 0 8px 30px #1822300d; }
    h1 { margin-top: 0; }
    button { border: 0; border-radius: 10px; padding: .8rem 1rem; background: #2457c5; color: white; font-weight: 650; cursor: pointer; }
    #result { margin-top: 1.2rem; padding: 1rem; background: #f3f5f8; border-radius: 10px; min-height: 1.5rem; }
    .muted { color: #526173; }
  </style>
</head>
<body>
  <main>
    <section>
      <p class="muted">Projeto educacional de compiladores</p>
      <h1>CompilaLab</h1>
      <p>Esta é a estrutura inicial da aplicação. Nesta etapa, vamos verificar se a interface consegue conversar com a API.</p>
      <button id="test">Testar backend</button>
      <div id="result" role="status" aria-live="polite">Clique no botão para testar a comunicação.</div>
    </section>
  </main>
  <script>
    const button = document.querySelector("#test");
    const result = document.querySelector("#result");
    button.addEventListener("click", async () => {
      result.textContent = "Conectando ao backend...";
      try {
        const response = await fetch("/api/hello");
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        const data = await response.json();
        result.textContent = `${data.message} — API do ${data.project} funcionando.`;
      } catch (error) {
        result.textContent = "Não foi possível conectar à API. Confira se os contêineres estão ativos.";
      }
    });
  </script>
</body>
</html>
